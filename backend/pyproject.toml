[project]
name = "spotistorage-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "spotifyscraper>=3.9.0",
    "yt-dlp>=2024.0.0",
    "mutagen>=1.47.0",
    "pycryptodome>=3.20.0",
    "aiosqlite>=0.20.0",
    "uvicorn[standard]",
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
